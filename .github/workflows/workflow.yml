# Workflow = roteiro que o GitHub Actions executa automaticamente.
name: Autoavaliação

# QUANDO roda: a cada PR aberto para a main e a cada novo commit enviado (git push) nesse PR.
on:
  pull_request:
    branches: [main]

# PERMISSÕES do robô: ler o código e escrever comentário no PR.
permissions:
  contents: read
  pull-requests: write

jobs:
  avaliar:                       # nome do "check" que a proteção da main exige
    runs-on: ubuntu-24.04        # máquina virtual temporária do GitHub
    timeout-minutes: 10
    steps:
      # 1) Baixa o código do PR para a máquina
      - uses: actions/checkout@v4

      # 2) Instala o Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3) Instala as dependências (Playwright) e o navegador usado nos testes
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # 4) Roda os testes: abre o index.html do aluno e confere cada requisito
      - name: Rodar testes
        run: npx playwright test

      # 5) Transforma o resultado em uma tabela (✅/❌ por requisito)
      #    "if: always()" = roda mesmo quando os testes falham
      - name: Montar tabela de requisitos
        if: always()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/gerar-checklist.js

      # 6) Publica a tabela como comentário no PR (e atualiza o mesmo comentário nos próximos commits)
      - name: Publicar (ou atualizar) a tabela no PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('comentario.md')) return;
            const body = fs.readFileSync('comentario.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comentarios = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existente = comentarios.find((c) => c.body.includes('<!-- autoavaliacao -->'));
            if (existente) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existente.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
